{% extends 'base.html' %}
{% block title %}Logowanie - FloweeBox{% endblock %}
{% block content %}
<div class="auth-box">
<div class="card">
<h2 style="margin-bottom:1rem">Logowanie</h2>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group">
<label for="login_id">Nazwa uzytkownika</label>
<input type="text" id="login_id" name="login_id" value="{{ login_id }}" required autocomplete="username" maxlength="80">
</div>
<div class="form-group">
<label for="password">Haslo</label>
<input type="password" id="password" name="password" required autocomplete="current-password" minlength="8" maxlength="128">
</div>
<button type="submit" class="btn btn-primary" style="width:100%">Zaloguj</button>
</form>
<p style="margin-top:1rem;font-size:.85rem;text-align:center">
Nie masz konta? <a href="{{ url_for('auth.register') }}">Zarejestruj sie</a>
</p>
</div>
</div>
{% endblock %}
