{% extends 'base.html' %}
{% block title %}Wrzuc plik - FloweeBox{% endblock %}
{% block content %}
<div class="auth-box" style="max-width:500px">
<div class="card">
<h2 style="margin-bottom:1rem">Wrzuc plik</h2>
<form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group">
<label for="title">Tytul</label>
<input type="text" id="title" name="title" value="{{ title }}" required maxlength="200">
</div>
<div class="form-group">
<label for="file">Plik (MP3, MP4, WEBM, OGG, WAV, FLAC, MKV, AVI, MOV)</label>
<input type="file" id="file" name="file" required accept=".mp3,.mp4,.webm,.ogg,.wav,.flac,.mkv,.avi,.mov">
</div>
<div class="form-group">
<label class="checkbox-label">
<input type="checkbox" name="is_public" value="1" checked>
Publiczny
</label>
</div>
<p style="font-size:.8rem;color:#888;margin-bottom:.75rem">Maks. rozmiar: 500 MB</p>
<button type="submit" class="btn btn-primary" style="width:100%">Wrzuc</button>
</form>
</div>
</div>
{% endblock %}
